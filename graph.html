<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/gif" href="kazuwalk.gif?v=2"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Farlands Tracker — Graphs</title>
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist@2.27.0/plotly.min.js"></script>
  <script src="https://unpkg.com/skinview3d@2.1.0/bundles/skinview3d.bundle.js"></script>
  <style>
    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1a1a2e;
      --panel:    #16213e;
      --border:   #2a2a4a;
      --accent1:  #e94560;
      --accent3:  #53d8fb;
      --accent4:  #a8ff78;
      --gold:     #f5c542;
      --text:     #e0e0e0;
      --subtext:  #8888aa;
      --input-bg: #0f3460;
      --radius:   8px;
      --brown:    #a0522d;
      --brown2:   #c8874a;
      --purple:   #9b59b6;
      --purple2:  #c39bd3;
      --blue:     #3498db;
      --blue2:    #1a5276;
      --pink:     #ff69b4;
      --red2:     #ff6b6b;
      --silver:   #a8a8b3;
      --brown3:   #d4956a;
      --green-dark: #4caf72;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
    }

    /* ── Layout ───────────────────────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "header header"
        "sidebar main";
      min-height: 100vh;
    }

    @media (max-width: 640px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-areas:
          "header"
          "sidebar"
          "main";
      }
      aside {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }

    /* ── Header ───────────────────────────────────────────────── */
    header {
      grid-area: header;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 24px;
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--accent3);
    }
    header .subtitle {
      color: var(--subtext);
      font-size: .8rem;
    }
    header .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent4);
      box-shadow: 0 0 6px var(--accent4);
      margin-left: auto;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .3; }
    }
    #last-updated {
      color: var(--subtext);
      font-size: .75rem;
    }

        /* ── Nav ── */
    nav {
      grid-area: header;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      padding: 8px 16px;
      min-height: 68px;
    }
    nav h1 {
      font-family: "Minecraft", monospace;
      font-size: .85rem;
      color: var(--accent3);
      margin-right: 8px;
      display: flex;
      align-items: center;
    }
    .nav-btn {
      font-family: "Minecraft", monospace;
      font-size: .7rem;
      padding: 7px 14px;
      background: #555;
      border-top: 2px solid #aaa;
      border-left: 2px solid #aaa;
      border-right: 2px solid #222;
      border-bottom: 2px solid #222;
      color: #fff;
      text-decoration: none;
      text-shadow: 1px 1px 0 #1a1a1a;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-btn:hover { filter: brightness(1.3); }
    .nav-btn.active {
      border-top-color: #222;
      border-left-color: #222;
      border-right-color: #aaa;
      border-bottom-color: #aaa;
      filter: brightness(0.85);
    }
    @media (max-width: 480px) {
      nav h1 { font-size: .6rem; }
      .nav-btn { font-size: .45rem; padding: 4px 8px; }
    }
    @media (max-width: 480px) {
    }
    /* ── Sidebar ──────────────────────────────────────────────── */
    aside {
      grid-area: sidebar;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .sidebar-section h3 {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--subtext);
      margin-bottom: 10px;
    }

    /* stat cards */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
    }
    .stat-card .label {
      font-size: .68rem;
      color: var(--subtext);
      margin-bottom: 3px;
    }
    .stat-card .value {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }
    .stat-card .value.accent1 { color: var(--accent1); }
    .stat-card .value.accent3 { color: var(--accent3); }
    .stat-card .value.accent4 { color: var(--accent4); }
    .stat-card .value.gold    { color: var(--gold);    }
    .stat-card .value.gray    { color: #888888;         }
    .stat-card .value.brown   { color: var(--brown);    }
    .stat-card .value.brown2  { color: var(--brown2);   }
    .stat-card .value.purple  { color: var(--purple);   }
    .stat-card .value.purple2 { color: var(--purple2);  }
    .stat-card .value.blue    { color: var(--blue);     }
    .stat-card .value.blue2   { color: var(--blue2);    }
    .stat-card .value.pink    { color: var(--pink);     }
    .stat-card .value.red2    { color: var(--red2);     }
    .stat-card .value.silver  { color: var(--silver);   }
    .stat-card .value.brown3  { color: var(--brown3);   }
    .stat-card .value.green-dark { color: var(--green-dark); }

    /* time filter */
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .filter-group label {
      font-size: .75rem;
      color: var(--subtext);
    }
    .filter-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .filter-row input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      padding: 5px 8px;
      font-size: .8rem;
      width: 0; /* let flex handle it */
    }
    .filter-row input:focus {
      outline: none;
      border-color: var(--accent3);
    }
    .filter-row span {
      color: var(--subtext);
      font-size: .75rem;
      white-space: nowrap;
    }
    .btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: .85rem;
      font-weight: 600;
      transition: filter .15s;
    }
    .btn:hover { filter: brightness(1.15); }
    .btn-primary { background: var(--accent3); color: #000; }
    .btn-ghost   {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--subtext);
    }

    /* chart toggle checkboxes */
    .toggle-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .toggle-list label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: .82rem;
      user-select: none;
    }
    .toggle-list input[type=checkbox] {
      accent-color: var(--accent3);
      width: 14px; height: 14px;
    }

    /* ── Main content ─────────────────────────────────────────── */
    main {
      grid-area: main;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .chart-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 16px 8px;
      transition: opacity .3s;
    }
    .chart-card.hidden { display: none; }
    .chart-card h2 {
      font-size: .88rem;
      font-weight: 600;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 10px;
    }
    .chart-card .plotly-chart {
      width: 100%;
      height: 260px;
    }


    /* heatmap */
    /* inventory */
    #card-items h2 { margin-bottom: 8px; }
    .inv-wrapper {
      background: #c6c6c6;
      border: 3px solid;
      border-color: #fff #555 #555 #fff;
      padding: 7px;
      display: flex;
      justify-content: center;
      box-sizing: border-box;
    }
    .inv-grid {
      display: grid;
      grid-template-columns: repeat(9, 36px);
      gap: 2px;
    }
    .inv-slot {
      width: 36px; height: 36px;
      background: #8b8b8b;
      border: 2px solid;
      border-color: #373737 #fff #fff #373737;
      position: relative;
      cursor: default;
      overflow: hidden;
      flex-shrink: 0;
    }
    .inv-slot.empty { background: #8b8b8b; }
    .inv-sprite {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 32px; height: 32px;
      image-rendering: pixelated;
      background-repeat: no-repeat;
    }
    .inv-count {
      position: absolute;
      bottom: 1px; right: 2px;
      font-size: 11px; font-weight: 700;
      color: #fff;
      text-shadow: 1px 1px 0 #3f3f3f;
      line-height: 1;
      font-family: monospace;
      pointer-events: none;
    }
    .inv-durbar {
      position:absolute; bottom:1px; left:1px; right:1px; height:2px;
      background:rgba(0,0,0,0.5); border-radius:1px;
    }
    .inv-durbar-fill { height:100%; border-radius:1px; }
    .inv-tooltip {
      display: none;
      position: absolute;
      bottom: calc(100% + 4px);
      left: 50%; transform: translateX(-50%);
      background: #100010; border: 1px solid #2d0065;
      padding: 4px 8px;
      white-space: nowrap; font-size: 12px;
      color: #fff; z-index: 100;
      pointer-events: none;
      font-family: monospace;
    }
    .inv-slot:hover .inv-tooltip { display: block; }
    .inv-hotbar-sep {
      grid-column: 1 / -1;
      height: 4px;
    }

    /* loading spinner */
    .spinner {
      width: 100%; height: 260px;
      display: flex; align-items: center; justify-content: center;
      color: var(--subtext);
      font-size: .85rem;
    }


    /* ── Progression block ───────────────────────────────────── */
    #card-progression {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    #card-progression h2 {
      font-size: .88rem;
      font-weight: 600;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #card-progression h2 a {
      font-size: .72rem;
      color: var(--accent3);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
    }
    .prog-bar-wrap {
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
      height: 10px;
      margin-bottom: 12px;
    }
    .prog-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent3), var(--accent4));
      transition: width .5s;
    }
    .prog-stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .prog-stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      flex: 1;
      min-width: 100px;
    }
    .prog-stat .lbl { font-size: .67rem; color: var(--subtext); margin-bottom: 3px; }
    .prog-stat .val { font-size: .9rem; font-weight: 700; }

    /* death table */
    .death-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .8rem;
      margin-top: 8px;
    }
    .death-table th {
      text-align: left;
      color: var(--subtext);
      padding: 4px 8px;
      border-bottom: 1px solid var(--border);
    }
    .death-table td {
      padding: 5px 8px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .death-table tr:last-child td { border-bottom: none; }

    /* error banner */
    .error-banner {
      background: #4a1a1a;
      border: 1px solid var(--accent1);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--accent1);
      font-size: .82rem;
      display: none;
    }
  </style>
</head>
<body>
<div class="layout">

  <!-- ── Header ─────────────────────────────────────────────── -->
  <nav>
  <h1><img src="kazuwalk.gif?v=2" style="height:52px;vertical-align:middle;image-rendering:pixelated;margin-right:8px;"><span style="display:flex;flex-direction:column;align-items:center;line-height:1.1;">Farlands<span style="font-size:.7em;opacity:.8">Tracker</span></span></h1>
  <a href="index.html" class="nav-btn">Dashboard</a>
  <a href="graph.html" class="nav-btn active">Graphs</a>
  <a href="pace.html" class="nav-btn">Pace</a>
  <a href="map.html" class="nav-btn">Map</a>
  <a href="log.html" class="nav-btn">Log</a>
  <a href="faq.html" class="nav-btn">FAQ</a>
</nav>

  <!-- ── Sidebar ────────────────────────────────────────────── -->
  <aside>

    <!-- Vue temporelle -->
    <div class="sidebar-section">
      <h3>Vue</h3>
      <div style="display:flex;flex-direction:column;gap:5px;">
        <button class="btn btn-ghost active" id="btn-view-all"  onclick="setView('all')"  style="text-align:left">Tout</button>
        <button class="btn btn-ghost"        id="btn-view-hour" onclick="setView('hour')" style="text-align:left">Dernière heure IGT</button>
      </div>
      <div style="margin-top:8px;" id="full-link-container"></div>
    </div>

    <!-- Axe X toggle -->
    <div class="sidebar-section">
      <h3>Axe X</h3>
      <div style="display:flex;gap:6px;">
        <button id="btn-igt" onclick="setXAxis('igt')"
          style="flex:1;padding:7px;background:#555;border-top:2px solid #222;border-left:2px solid #222;border-right:2px solid #aaa;border-bottom:2px solid #aaa;color:var(--accent4);font-family:monospace;font-size:.65rem;cursor:pointer;">
          IGT
        </button>
        <button id="btn-rta" onclick="setXAxis('rta')"
          style="flex:1;padding:7px;background:#555;border-top:2px solid #aaa;border-left:2px solid #aaa;border-right:2px solid #222;border-bottom:2px solid #222;color:var(--subtext);font-family:monospace;font-size:.65rem;cursor:pointer;">
          RTA
        </button>
      </div>
    </div>

    <!-- Chart toggles -->
    <div class="sidebar-section">
      <h3>Charts</h3>
      <div class="toggle-list">
        <label><input type="checkbox" checked data-card="card-hp">       Health</label>
        <label><input type="checkbox" checked data-card="card-speed">    Speed</label>
        <label><input type="checkbox" checked data-card="card-dist">     Distance (XZ)</label>
        <label><input type="checkbox" checked data-card="card-items">    Inventaire</label>
        <label><input type="checkbox" checked data-card="card-elevation"> Élévation</label>
      </div>
    </div>

  </aside>


  <!-- ── Main ───────────────────────────────────────────────── -->
  <main>
    <div class="error-banner" id="error-banner"></div>

    <div id="mobile-warning" style="display:none; background:#2a1a0a; border:1px solid var(--gold); border-radius:var(--radius); padding:12px 16px; font-size:.8rem; color:var(--gold); margin-bottom:8px;">
      ⚠ Cette page est optimisée pour PC — certains graphiques peuvent être difficiles à lire sur mobile.
    </div>
    <script>if (window.innerWidth <= 640) document.getElementById('mobile-warning').style.display = 'block';</script>

    <!-- HP -->
    <div class="chart-card" id="card-hp">
      <h2>❤ Health over time</h2>
      <div class="plotly-chart" id="chart-hp"></div>
    </div>

    <!-- Speed -->
    <div class="chart-card" id="card-speed">
      <h2>💨 Horizontal speed</h2>
      <div class="plotly-chart" id="chart-speed"></div>
    </div>

    <!-- Distance -->
    <div class="chart-card" id="card-dist">
      <h2>📏 Cumulative distance (XZ)</h2>
      <div class="plotly-chart" id="chart-dist"></div>
    </div>


    <!-- Inventaire -->
    <div class="chart-card" id="card-items">
      <h2>🎒 Inventaire</h2>
      <div style="display:flex; align-items:center; gap:12px; background:#c6c6c6; border:3px solid; border-color:#fff #555 #555 #fff; padding:7px; box-sizing:border-box;">
        <canvas id="skin-canvas" style="width:80px; height:160px; flex-shrink:0; background:transparent;"></canvas>
        <div class="inv-grid" id="inv-grid" style="flex:1"></div>
      </div>
    </div>

    <!-- Elevation -->
    <div class="chart-card" id="card-elevation">
      <h2>⛰ Élévation (coordonnée Y)</h2>
      <div class="plotly-chart" id="chart-elevation"></div>
    </div>


  </main>
</div>

<script>

// ================================================================
// Config
// ================================================================
const REFRESH_MS   = 30_000;
let _lastKnownTs   = null;


let _xAxisMode = 'igt';

function setXAxis(mode) {
  _xAxisMode = mode;
  const active = 'border-top-color:#222;border-left-color:#222;border-right-color:#aaa;border-bottom-color:#aaa;';
  const inactive = 'border-top-color:#aaa;border-left-color:#aaa;border-right-color:#222;border-bottom-color:#222;';
  document.getElementById('btn-igt').style.cssText += mode === 'igt' ? ';border-top-color:#222;border-left-color:#222;border-right-color:#aaa;border-bottom-color:#aaa;color:var(--accent4)' : ';border-top-color:#aaa;border-left-color:#aaa;border-right-color:#222;border-bottom-color:#222;color:var(--subtext)';
  document.getElementById('btn-rta').style.cssText += mode === 'rta' ? ';border-top-color:#222;border-left-color:#222;border-right-color:#aaa;border-bottom-color:#aaa;color:var(--accent3)' : ';border-top-color:#aaa;border-left-color:#aaa;border-right-color:#222;border-bottom-color:#222;color:var(--subtext)';
  loadAll();
}

function xAxis(rows) {
  return rows.map(r => _xAxisMode === 'rta' ? (r.rts != null ? r.rts : r.igt / 20) : r.igt);
}
function xTitle() { return _xAxisMode === 'rta' ? 'RTA (hh:mm:ss)' : 'IGT (hh:mm:ss)'; }
function xTickLabels(x) {
  return x.map(v => ticksToHMS(_xAxisMode === 'rta' ? Math.round(v * 20) : v));
}   // auto-refresh interval
let _firstRealTs   = null;     // partagé entre loadSummary et loadProgression
const IGT_PER_SEC  = 20;       // 20 ticks = 1 second IGT

// ================================================================
// Plotly shared layout base
// ================================================================
const LAYOUT_BASE = {
  paper_bgcolor: "transparent",
  plot_bgcolor:  "#16213e",
  font:          { color: "#e0e0e0", size: 11 },
  margin:        { t: 10, r: 20, b: 50, l: 60 },
  xaxis: {
    gridcolor:   "#2a2a4a",
    linecolor:   "#2a2a4a",
    tickcolor:   "#2a2a4a",
    zerolinecolor: "#2a2a4a",
  },
  yaxis: {
    gridcolor:   "#2a2a4a",
    linecolor:   "#2a2a4a",
    tickcolor:   "#2a2a4a",
    zerolinecolor: "#2a2a4a",
  },
  legend: {
    bgcolor:     "rgba(22,33,62,.8)",
    bordercolor: "#2a2a4a",
    borderwidth: 1,
  },
};
const PLOTLY_CONFIG = { responsive: true, displaylogo: false,
                        modeBarButtonsToRemove: ["lasso2d","select2d"] };

// ================================================================
// IGT helpers
// ================================================================
function hmsToTicks(h, m, s) {
  return ((+h || 0) * 3600 + (+m || 0) * 60 + (+s || 0)) * IGT_PER_SEC;
}

function ticksToHMS(ticks) {
  const s   = Math.floor(ticks / IGT_PER_SEC);
  const h   = Math.floor(s / 3600);
  const m   = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

// Build an X-axis tick array (ticks → "hh:mm:ss" labels)
function igtAxis(data, key = "igt") {
  return data.map(d => d[key]);
}
function igtLabels(data, key = "igt") {
  return data.map(d => ticksToHMS(d[key]));
}

// ================================================================
// Filter state
// ================================================================
let filterFromTicks = null;
let filterToTicks   = null;

let _lastMaxIgt = 0;

function setView(v) {
  document.getElementById('btn-view-all').classList.toggle('active',  v === 'all');
  document.getElementById('btn-view-hour').classList.toggle('active', v === 'hour');
  filterFromTicks = v === 'hour' ? Math.max(0, _lastMaxIgt - 72000) : null;
  filterToTicks   = null;
  loadAll();
}

function updateFullLink() {
  const lc = document.getElementById('full-link-container');
  if (!lc) return;
  if (!_fullMode) {
    lc.innerHTML = '<a href="graph.html?full=1" target="_blank" style="color:var(--accent3);font-size:.7rem;text-decoration:none">↗ Version complète (500k pts)</a>';
  } else {
    lc.innerHTML = '<span style="color:var(--subtext);font-size:.7rem">Mode complet actif</span>';
  }
}

function rangeParams() {
  const p = new URLSearchParams();
  if (filterFromTicks !== null) p.set("from_igt", filterFromTicks);
  if (filterToTicks   !== null) p.set("to_igt",   filterToTicks);
  return p.toString() ? "?" + p.toString() : "";
}

// Filtre côté client sur le champ igt (ou world_time selon les données)
function filterByIgt(rows, igtKey = "igt") {
  if (filterFromTicks === null && filterToTicks === null) return rows;
  return rows.filter(r => {
    const v = r[igtKey];
    if (filterFromTicks !== null && v < filterFromTicks) return false;
    if (filterToTicks   !== null && v > filterToTicks)   return false;
    return true;
  });
}

async function apiFetch(endpoint) {
  if (_useFlask === null) {
    try {
      const probe = await fetch("/api/summary");
      _useFlask = probe.ok;
    } catch(_) { _useFlask = false; }
  }
  const base = endpoint.split("?")[0];
  const fsfx = (_fullMode && _useFlask) ? (endpoint.includes("?")?"&full=1":"?full=1") : "";
  const apiMap = _fullMode ? API_MAP_FULL : API_MAP_HOUR;
  const url  = _useFlask ? endpoint + fsfx : (apiMap[base] || endpoint) + "?_=" + Date.now();
  const r    = await fetch(url);
  if (!r.ok) throw new Error(`${url} → HTTP ${r.status}`);
  return r.json();
}

function showError(msg) {
  const el = document.getElementById("error-banner");

}

function fmtSecs(sec) {
  if (sec == null) return "—";
  const t = Math.round(sec);
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const s = t % 60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function renderInventory(invStr) {
  // Format: "slot:Name:count,slot:Name:count,..."
  // Slots 0-8 = hotbar, 9-35 = inventaire principal
  const slots = new Array(36).fill(null);

  if (invStr) {
    invStr.split(",").forEach(function(part) {
      const bits = part.split(":");
      if (bits.length < 3) return;
      const slot   = parseInt(bits[0]);
      const damage = bits.length >= 4 ? parseInt(bits[bits.length - 1]) || 0 : 0;
      const count  = bits.length >= 4 ? parseInt(bits[bits.length - 2]) || 0
                                       : parseInt(bits[bits.length - 1]) || 0;
      const name   = bits.length >= 4 ? bits.slice(1, -2).join(":")
                                       : bits.slice(1, -1).join(":");
      if (slot >= 0 && slot < 36 && name && count > 0) {
        slots[slot] = { name, count, damage };
      }
    });
  }

  const grid = document.getElementById("inv-grid");
  if (!grid) return;

  // Afficher : inventaire principal (slots 9-35) puis hotbar (slots 0-8)
  let html = "";
  for (var i = 9; i < 36; i++) {
    if (i === 9) {} // début inventaire
    html += renderSlot(slots[i]);
  }
  html += '<div class="inv-hotbar-sep"></div>';
  for (var i = 0; i < 9; i++) {
    html += renderSlot(slots[i]);
  }
  grid.innerHTML = html;
}

function renderSlot(slot) {
  if (!slot) return '<div class="inv-slot empty"></div>';
  const sp = ITEM_SPRITES[slot.name];
  let spriteStyle = "";
  if (sp) {
    spriteStyle = 'background-image:url(' + sp.s + ');' +
      'background-position:-' + sp.x + 'px -' + sp.y + 'px;' +
      'background-size:auto;';
  }
  let durBar = "";
  const maxDmg = MAX_DAMAGE[slot.name];
  if (maxDmg && slot.damage > 0) {
    const pct = Math.max(0, Math.min(100, (1 - slot.damage / maxDmg) * 100));
    const r   = Math.round(255 * (1 - pct / 100));
    const g   = Math.round(255 * (pct / 100));
    durBar = '<div class="inv-durbar"><div class="inv-durbar-fill" style="width:' +
             pct.toFixed(0) + '%;background:rgb(' + r + ',' + g + ',0)"></div></div>';
  }
  const tooltip = slot.name + (slot.count > 1 ? ' x' + slot.count : '') +
    (maxDmg && slot.damage > 0 ? ' (' + (maxDmg - slot.damage) + '/' + maxDmg + ')' : '');
  return '<div class="inv-slot">' +
    '<div class="inv-sprite" style="' + spriteStyle + '"></div>' +
    (slot.count > 1 ? '<span class="inv-count">' + slot.count + '</span>' : '') +
    durBar +
    '<span class="inv-tooltip">' + tooltip + '</span>' +
    '</div>';
}

function _tickVals(arr, n) {
  if (!arr.length) return [];
  const step = Math.max(1, Math.floor(arr.length / n));
  const vals = [];
  for (let i = 0; i < arr.length; i += step) vals.push(arr[i]);
  return vals;
}

async function loadProgression() {
  try {
    // S'assurer que _useFlask est détecté avant de fetcher
    if (_useFlask === null) {
      try {
        var probe = await fetch('/api/summary', { method: 'HEAD' });
        _useFlask = probe.ok;
      } catch(_) { _useFlask = false; }
    }
    var resp = await fetch(_useFlask ? '/api/pace' : 'data/pace.json?_=' + Date.now());
    var data = await resp.json();
    if (!data || !data.length) return;

    var last = data[data.length - 1];

    document.getElementById('idx-prog-bar').style.width = (last.i / 1000) + '%';
    document.getElementById('idx-prog-pct').textContent = last.pct.toFixed(3) + '%';
    var splashEl = document.getElementById('stat-splash-pct');
    if (splashEl) {
      splashEl.textContent = last.pct.toFixed(3) + '%';
      splashEl.style.display = 'block';
    }
    document.getElementById('idx-prog-igt').textContent = _fmtS(last.igt_total_s);

    if (_firstRealTs) {
      document.getElementById('idx-prog-rta').textContent = _fmtS(Date.now() / 1000 - _firstRealTs);
    }
    document.getElementById('idx-prog-pace').textContent = last.pace_overall.toFixed(4) + ' bl/s';
    document.getElementById('idx-prog-eta').textContent = _fmtS(last.eta_ovr_s);

    // Average % time : moyenne des % terminés (ceux dont le suivant existe)
    var pctGroups = {};
    data.forEach(function(d) {
      var p = Math.ceil(d.pct);
      if (!pctGroups[p]) pctGroups[p] = [];
      pctGroups[p].push(d);
    });
    var completedPcts = Object.keys(pctGroups).map(Number)
      .filter(function(p){ return p >= 1 && pctGroups[p + 1] != null; })
      .sort(function(a,b){ return a - b; });
    var avgSegS = null;
    if (completedPcts.length > 0) {
      var prevIgtAvg = 0, totalSegS = 0;
      completedPcts.forEach(function(p) {
        var lastM = pctGroups[p][pctGroups[p].length - 1];
        totalSegS  += lastM.igt_total_s - prevIgtAvg;
        prevIgtAvg  = lastM.igt_total_s;
      });
      avgSegS = totalSegS / completedPcts.length;
    }
    document.getElementById('idx-prog-seg').textContent = avgSegS != null ? _fmtS(avgSegS) : '--';

    // Delta vs run précédente (interpolation)
    var pctF = last.pct;
    var lo = Math.floor(pctF), hi = Math.ceil(pctF);
    var hLo = PACE_HIST[lo], hHi = PACE_HIST[hi];
    var hIGT = (hLo != null && hHi != null && lo !== hi) ? hLo + (pctF - lo)*(hHi - hLo) : hLo;
    if (hIGT != null) {
      var diff = last.igt_total_s - hIGT;
      var col  = diff <= 0 ? 'var(--accent4)' : 'var(--accent1)';
      var sign = diff <= 0 ? '-' : '+';
      document.getElementById('idx-prog-vs').innerHTML =
        '<span style="color:' + col + '">' + sign + _fmtS(Math.abs(diff)) + '</span>';
    }
  } catch(e) { /* silencieux */ }
}

// ================================================================
// Load all
// ================================================================

const _fullMode = new URLSearchParams(window.location.search).get('full') === '1';

async function loadAll() {
  try {
    const s = await apiFetch("/api/summary");
    const ts = s.last_real_ts || s.first_real_ts;
    if (ts && ts === _lastKnownTs) return;
    _lastKnownTs = ts;
    if (s.total_igt) {
      _lastMaxIgt = s.total_igt;
      // Par défaut : dernière heure (sauf en mode full)
      if (!_fullMode && filterFromTicks === null) {
        filterFromTicks = Math.max(0, _lastMaxIgt - 72000);
        document.getElementById('btn-view-hour').classList.add('active');
        document.getElementById('btn-view-all').classList.remove('active');
      }
    }
  } catch(e) { /* continuer */ }

  loadSummary();
  loadHP();
  loadSpeed();
  loadDistance();
  loadX();
  loadElevation();
  loadItems();
  updateLastUpdated();
  updateFullLink();
}

function updateLastUpdated() {
  const el = document.getElementById("last-updated");
  if (el) el.textContent = "Updated " + new Date().toLocaleTimeString();
}

// Initial load + auto-refresh every 30s
loadAll();
setInterval(loadAll, REFRESH_MS);


function _unused() {
  const el = document.getElementById("last-updated");
  if (el) el.textContent = "Updated " + new Date().toLocaleTimeString();
}
</script>
