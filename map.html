<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Farlands — Carte</title>
  <link rel="icon" type="image/gif" href="kazuwalk.gif?v=2"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0d0d14; --panel:#16213e; --border:#2a2a4a;
      --accent3:#53d8fb; --accent4:#a8ff78; --gold:#f5c542;
      --text:#e0e0e0; --subtext:#8888aa;
    }
    html, body { height:100%; background:var(--bg); color:var(--text);
      font-family:'Segoe UI',system-ui,sans-serif; font-size:14px; overflow:hidden; }

    nav {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      padding: 8px 16px;
      min-height: 68px;
      position: relative;
      z-index: 10;
    }
    nav h1 {
      font-family: "Minecraft", monospace;
      font-size: .85rem;
      color: var(--accent3);
      margin-right: 8px;
      display: flex;
      align-items: center;
    }
    .nav-btn {
      font-family: "Minecraft", monospace;
      font-size: .7rem;
      padding: 7px 14px;
      background: #555;
      border-top: 2px solid #aaa;
      border-left: 2px solid #aaa;
      border-right: 2px solid #222;
      border-bottom: 2px solid #222;
      color: #fff;
      text-decoration: none;
      text-shadow: 1px 1px 0 #1a1a1a;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-btn:hover { filter: brightness(1.3); }
    .nav-btn.active {
      border-top-color: #222; border-left-color: #222;
      border-right-color: #aaa; border-bottom-color: #aaa;
      filter: brightness(0.85);
    }
    @media (max-width: 480px) {
      nav h1 { font-size: .6rem; }
      .nav-btn { font-size: .45rem; padding: 4px 8px; }
    }

    .map-layout { display:flex; height:calc(100vh - 68px); }

    /* ── Sidebar ── */
    .sidebar {
      width:210px; flex-shrink:0; background:var(--panel);
      border-right:1px solid var(--border);
      display:flex; flex-direction:column; overflow-y:auto;
    }

    /* ── Mobile : sidebar en bas ── */
    @media (max-width:600px) {
      .map-layout { flex-direction:column; }
      .sidebar {
        width:100%; height:auto; flex-shrink:0;
        border-right:none; border-top:1px solid var(--border);
        order:2; overflow:hidden;
        max-height:0; transition:max-height .3s ease;
      }
      .sidebar.open { max-height:60vh; overflow-y:auto; }
      .map-container { order:1; flex:1; }
      #mobile-toggle {
        display:flex; align-items:center; justify-content:center;
        position:absolute; bottom:50px; left:50%; transform:translateX(-50%);
        z-index:20; background:rgba(22,33,62,.9); border:1px solid var(--border);
        border-radius:20px; padding:6px 16px; font-size:.7rem; color:var(--text);
        cursor:pointer; gap:6px; white-space:nowrap;
      }
    }
    @media (min-width:601px) {
      #mobile-toggle { display:none; }
    }
    .sb { padding:10px 12px; border-bottom:1px solid var(--border); }
    .sb h3 { font-size:.65rem; text-transform:uppercase; letter-spacing:.07em;
      color:var(--subtext); margin-bottom:8px; }

    /* TP input */
    .tp-row { display:flex; gap:4px; margin-bottom:5px; }
    .tp-row input {
      flex:1; background:#1a1a2e; border:1px solid var(--border);
      color:var(--text); padding:5px 7px; border-radius:3px;
      font-size:.75rem; font-family:monospace; width:0;
    }
    .tp-row input:focus { outline:none; border-color:var(--accent3); }
    .tp-btn {
      padding:5px 10px; background:#3a5a7a; border:none; border-radius:3px;
      color:var(--text); font-size:.75rem; cursor:pointer; white-space:nowrap;
    }
    .tp-btn:hover { background:#4a7a9a; }

    /* Checkboxes */
    .cb-row { display:flex; align-items:center; gap:6px; font-size:.78rem;
      padding:3px 0; cursor:pointer; color:var(--subtext); }
    .cb-row:hover { color:var(--text); }
    .cb-row input { accent-color:var(--accent3); }

    /* Stats */
    .stat-row { display:flex; justify-content:space-between;
      font-size:.72rem; padding:2px 0; }
    .stat-row span:first-child { color:var(--subtext); }
    .stat-row span:last-child  { color:var(--text); font-family:monospace; }

    /* Coords */
    .coords-bar { padding:8px 12px; font-family:monospace; font-size:.72rem;
      color:var(--subtext); margin-top:auto; border-top:1px solid var(--border); }

    /* ── Canvas ── */
    .map-container { flex:1; position:relative; overflow:hidden; cursor:crosshair; }
    #map-canvas { position:absolute; top:0; left:0; }

    /* Tooltip */
    #tooltip {
      position:absolute; background:rgba(16,21,48,.95);
      border:1px solid var(--border); border-radius:5px;
      padding:5px 9px; font-size:.72rem; pointer-events:none;
      display:none; z-index:20; font-family:monospace;
    }

    /* Scale bar */
    #scale-bar {
      position:absolute; bottom:10px; right:10px;
      background:rgba(16,21,48,.85); border:1px solid var(--border);
      border-radius:4px; padding:3px 8px; font-size:.7rem;
      color:var(--subtext); pointer-events:none; font-family:monospace;
    }

    /* Loading */
    #loading {
      position:absolute; inset:0; background:var(--bg);
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; z-index:30; gap:12px;
    }
    .spinner { width:32px; height:32px; border:3px solid var(--border);
      border-top-color:var(--accent3); border-radius:50%;
      animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

<nav>
  <h1><img src="kazuwalk.gif?v=2" style="height:52px;vertical-align:middle;image-rendering:pixelated;margin-right:8px;"><span style="display:flex;flex-direction:column;align-items:center;line-height:1.1;">Farlands<span style="font-size:.7em;opacity:.8">Tracker</span></span></h1>
  <a href="index.html" class="nav-btn">Dashboard</a>
  <a href="graph.html" class="nav-btn">Graphs</a>
  <a href="pace.html" class="nav-btn">Pace</a>
  <a href="map.html" class="nav-btn active">Map</a>
  <a href="log.html" class="nav-btn">Log</a>
  <a href="faq.html" class="nav-btn">FAQ</a>
</nav>

<div class="map-layout">

  <div class="sidebar">

    <div class="sb">
      <h3>Téléportation</h3>
      <div class="tp-row">
        <input type="number" id="tp-x" placeholder="X" />
        <input type="number" id="tp-z" placeholder="Z" />
        <button class="tp-btn" onclick="teleport()">Go</button>
      </div>
      <div style="font-size:.68rem;color:var(--subtext)">Entrée pour valider</div>
    </div>

    <div class="sb">
      <h3>Afficher</h3>
      <label class="cb-row"><input type="checkbox" id="show-path"    checked onchange="redraw()"> Chemin</label>
      <label class="cb-row"><input type="checkbox" id="show-grid"    checked onchange="redraw()"> Grille</label>
      <label class="cb-row"><input type="checkbox" id="show-labels"  checked onchange="redraw()"> Labels grille</label>
      <label class="cb-row"><input type="checkbox" id="show-origin"  checked onchange="redraw()"> Origine (0,0)</label>
      <label class="cb-row"><input type="checkbox" id="show-cur"     checked onchange="redraw()"> Position actuelle</label>
      <label class="cb-row"><input type="checkbox" id="show-speed-gradient" onchange="redraw()"> Dégradé vitesse</label>
    </div>

    <div class="sb">
      <h3>Statistiques</h3>
      <div id="stats-content" style="font-size:.72rem;color:var(--subtext);">—</div>
    </div>

    <div class="coords-bar">
      <div>X: <span id="cx" style="color:var(--text)">—</span></div>
      <div>Z: <span id="cz" style="color:var(--text)">—</span></div>
      <div style="margin-top:3px;font-size:.65rem" id="pct-hint"></div>
    </div>
  </div>

  <div class="map-container" id="map-container">
    <div id="loading">
      <div class="spinner"></div>
      <div style="color:var(--subtext);font-size:.85rem">Chargement…</div>
    </div>
    <canvas id="map-canvas"></canvas>
    <div id="tooltip"></div>
    <div id="scale-bar">—</div>
    <div id="mobile-toggle" onclick="toggleSidebar()">⚙ Options</div>
  </div>
</div>

<script>
// ── Data ────────────────────────────────────────────────────────
let _data     = null;

// ── View ─────────────────────────────────────────────────────────
let _ox = 0, _oz = 0, _scale = 1;
let _drag = false, _dsx = 0, _dsz = 0, _dox = 0, _doz = 0;

const FAR_LANDS = 12_550_824;

function s2w(sx, sz) { return { x:(sx-_ox)/_scale, z:(sz-_oz)/_scale }; }
function w2s(x,  z)  { return { sx:x*_scale+_ox,   sz:z*_scale+_oz   }; }

// ── Load ─────────────────────────────────────────────────────────
async function loadData() {
  try {
    const isFlask = await fetch('/api/summary').then(r=>r.ok).catch(()=>false);
    const url = isFlask ? '/data/map_data.json' : 'data/map_data.json?_='+Date.now();
    const r = await fetch(url);
    if (!r.ok) throw new Error('map_data.json introuvable — lance gen_map.py');
    _data = await r.json();
    document.getElementById('loading').style.display = 'none';
    initView();
    buildPathIndex();
    updateStats();
    redraw();
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<div style="color:#e94560;text-align:center;padding:20px">${e.message}</div>`;
  }
}

// ── Init ─────────────────────────────────────────────────────────
const MAP_LIMIT = 12_550_824;

function initView() {
  const c = document.getElementById('map-container');
  resizeCanvas();
  const W = c.clientWidth, H = c.clientHeight;

  if (!_data || !_data.path || _data.path.length === 0) {
    // Fallback : vue complète
    _scale = Math.min(W, H) / (MAP_LIMIT * 2 * 1.05);
    _ox = W/2; _oz = H/2;
    return;
  }

  // Zoom initial sur le chemin parcouru
  const xs = _data.path.map(p=>p[0]);
  const zs = _data.path.map(p=>p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minZ = Math.min(...zs), maxZ = Math.max(...zs);
  const rangeX = Math.max(maxX - minX, 1000);
  const rangeZ = Math.max(maxZ - minZ, 500);

  _scale = Math.min(W / (rangeX * 1.15), H / (rangeZ * 3));
  _scale = Math.min(_scale, 4);
  _ox = W/2 - (minX + rangeX/2) * _scale;
  _oz = H/2 - (minZ + rangeZ/2) * _scale;
}

function minScale(W, H) {
  // Échelle minimale = vue complète du monde carré
  return Math.min(W, H) / (MAP_LIMIT * 2 * 1.05);
}

function resizeCanvas() {
  const c = document.getElementById('map-container');
  const cv = document.getElementById('map-canvas');
  cv.width = c.clientWidth; cv.height = c.clientHeight;
}

// ── Pct marks ────────────────────────────────────────────────────
function buildPctMarks() {
  if (!_data || !_data.path || _data.path.length < 2) return;
  _pctMarks = [];
  const path = _data.path;

  // Les repères % sont basés sur la coordonnée X absolue
  // 1% = FAR_LANDS / 100 blocs parcourus depuis X=0
  // On cherche le point du chemin dont |x| est le plus proche de pct * FAR_LANDS / 100
  for (let pct = 1; pct <= 100; pct++) {
    const targetAbsX = FAR_LANDS * pct / 100;
    let best = null, bestDist = Infinity;
    for (let i = 0; i < path.length; i++) {
      const d = Math.abs(Math.abs(path[i][0]) - targetAbsX);
      if (d < bestDist) { bestDist = d; best = i; }
    }
    if (best !== null && bestDist < FAR_LANDS / 100 * 2) {
      _pctMarks.push({ pct, x: path[best][0], z: path[best][1] });
    }
  }
}

function updateStats() {
  if (!_data) return;
  const path = _data.path || [];
  const el   = document.getElementById('stats-content');
  if (path.length === 0) { el.textContent = 'Aucun chemin'; return; }

  const startX = path[0][0];
  const lastX  = path[path.length-1][0];
  const dist   = Math.abs(lastX - startX);
  const pct    = (dist / FAR_LANDS * 100).toFixed(3);
  const remaining = FAR_LANDS - dist;

  el.innerHTML = `
    <div style="margin-bottom:4px">
      <div style="color:var(--gold);font-size:.8rem;margin-bottom:2px">${pct}% accompli</div>
      <div style="background:#1a1a2e;border-radius:3px;height:4px;overflow:hidden">
        <div style="background:var(--accent4);width:${Math.min(100,pct)}%;height:100%"></div>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:4px">
      <span>Début</span><span style="color:var(--text)">${Math.round(startX).toLocaleString()}</span>
    </div>
    <div style="display:flex;justify-content:space-between">
      <span>Actuel</span><span style="color:var(--text)">${Math.round(lastX).toLocaleString()}</span>
    </div>
    <div style="display:flex;justify-content:space-between">
      <span>Restant</span><span style="color:var(--text)">${Math.round(remaining).toLocaleString()} bl</span>
    </div>
    <div style="display:flex;justify-content:space-between">
      <span>Points</span><span style="color:var(--text)">${path.length.toLocaleString()}</span>
    </div>`;
}

// ── Draw ─────────────────────────────────────────────────────────
function redraw() {
  if (!_data) return;
  const cv  = document.getElementById('map-canvas');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const path = _data.path || [];

  // Fond
  ctx.fillStyle = '#080810';
  ctx.fillRect(0, 0, W, H);

  // ── Grille ──
  if (document.getElementById('show-grid').checked) {
    // Adapter l'espacement de la grille au zoom
    const gridBlocs = gridSpacing();
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;

    const wMin = s2w(0, 0), wMax = s2w(W, H);
    const gx0 = Math.floor(wMin.x / gridBlocs) * gridBlocs;
    const gz0 = Math.floor(wMin.z / gridBlocs) * gridBlocs;

    for (let gx = gx0; gx < wMax.x; gx += gridBlocs) {
      const {sx} = w2s(gx, 0);
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
    }
    for (let gz = gz0; gz < wMax.z; gz += gridBlocs) {
      const {sz} = w2s(0, gz);
      ctx.beginPath(); ctx.moveTo(0, sz); ctx.lineTo(W, sz); ctx.stroke();
    }

    // Labels grille
    if (document.getElementById('show-labels').checked && _scale > 0.00005) {
      ctx.fillStyle = 'rgba(136,136,170,0.7)';
      ctx.font = `${Math.max(9, Math.min(11, _scale * 500))}px monospace`;
      ctx.textAlign = 'left';
      for (let gx = gx0; gx < wMax.x; gx += gridBlocs) {
        const {sx} = w2s(gx, 0);
        if (sx > 2 && sx < W - 40) {
          ctx.fillText(Math.round(gx).toLocaleString(), sx + 3, 12);
        }
      }
      ctx.textAlign = 'right';
      for (let gz = gz0; gz < wMax.z; gz += gridBlocs) {
        const {sz} = w2s(0, gz);
        if (sz > 12 && sz < H - 2) {
          ctx.fillText(Math.round(gz).toLocaleString(), W - 3, sz - 2);
        }
      }
    }
  }

  // ── Axe X=0 Z=0 ──
  if (document.getElementById('show-origin').checked) {
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1; ctx.setLineDash([4,4]);
    const {sx:ox} = w2s(0,0), {sz:oz} = w2s(0,0);
    ctx.beginPath(); ctx.moveTo(ox,0); ctx.lineTo(ox,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,oz); ctx.lineTo(W,oz); ctx.stroke();
    ctx.setLineDash([]);
    if (ox>0&&ox<W&&oz>0&&oz<H) {
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.font='10px monospace'; ctx.textAlign='left';
      ctx.fillText('0,0', ox+4, oz-4);
    }
  }

  // ── Bords de la map : carré Far Lands ──
  const {sx: flXneg} = w2s(-MAP_LIMIT, 0);
  const {sx: flXpos} = w2s( MAP_LIMIT, 0);
  const {sz: flZneg} = w2s(0, -MAP_LIMIT);
  const {sz: flZpos} = w2s(0,  MAP_LIMIT);
  ctx.strokeStyle = 'rgba(233,69,96,0.5)';
  ctx.lineWidth = 1.5; ctx.setLineDash([6,4]);
  // X = -MAP_LIMIT (gauche)
  ctx.beginPath(); ctx.moveTo(flXneg, 0); ctx.lineTo(flXneg, H); ctx.stroke();
  // X = +MAP_LIMIT (droite)
  ctx.beginPath(); ctx.moveTo(flXpos, 0); ctx.lineTo(flXpos, H); ctx.stroke();
  // Z = -MAP_LIMIT (haut)
  ctx.beginPath(); ctx.moveTo(0, flZneg); ctx.lineTo(W, flZneg); ctx.stroke();
  // Z = +MAP_LIMIT (bas)
  ctx.beginPath(); ctx.moveTo(0, flZpos); ctx.lineTo(W, flZpos); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(233,69,96,0.7)';
  ctx.font = '10px monospace';
  if (flXneg > 2 && flXneg < W) { ctx.textAlign='left';  ctx.fillText('Far Lands', flXneg+4, 14); }
  if (flXpos > 2 && flXpos < W) { ctx.textAlign='right'; ctx.fillText('Far Lands', flXpos-4, 14); }
  if (flZneg > 2 && flZneg < H) { ctx.textAlign='left';  ctx.fillText('Far Lands', 4, flZneg-4); }
  if (flZpos > 2 && flZpos < H) { ctx.textAlign='left';  ctx.fillText('Far Lands', 4, flZpos+12); }

  // ── Chemin ──
  if (document.getElementById('show-path').checked && path.length > 1) {
    const lw = Math.max(1, Math.min(2.5, _scale * 5000));
    const useGradient = document.getElementById('show-speed-gradient').checked;
    const {sx:fx, sz:fz} = w2s(path[0][0], path[0][1]);

    if (!useGradient) {
      ctx.strokeStyle = '#53d8fb';
      ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(fx, fz);
      for (let i = 1; i < path.length; i++) {
        const {sx, sz} = w2s(path[i][0], path[i][1]);
        ctx.lineTo(sx, sz);
      }
      ctx.stroke();
    } else {
      // Calculer vitesses sur axe X uniquement (blocs/s), cap à 8
      const speeds = [];
      for (let i = 1; i < path.length; i++) {
        const dx = Math.abs(path[i][0] - path[i-1][0]);
        const dt = (path[i][2] - path[i-1][2]) / 20;
        speeds.push(dt > 0 ? Math.min(8, dx / dt) : 0);
      }
      const maxSpd = 8;
      const minSpd = 0;
      const range  = maxSpd;

      ctx.lineWidth = lw; ctx.lineCap = 'round';
      for (let i = 1; i < path.length; i++) {
        const {sx:x0, sz:z0} = w2s(path[i-1][0], path[i-1][1]);
        const {sx:x1, sz:z1} = w2s(path[i][0], path[i][1]);
        if (x0 < -10 && x1 < -10) continue;
        if (x0 > W+10 && x1 > W+10) continue;
        const t = Math.max(0, Math.min(1, (speeds[i-1] - minSpd) / range));
        const r = t < 0.5 ? 255 : Math.round(255 * (1 - (t-0.5)*2));
        const g = t < 0.5 ? Math.round(255 * t * 2) : 255;
        ctx.strokeStyle = `rgb(${r},${g},0)`;
        ctx.beginPath(); ctx.moveTo(x0, z0); ctx.lineTo(x1, z1); ctx.stroke();
      }
    }

    // Départ
    ctx.fillStyle = '#a8ff78';
    ctx.beginPath(); ctx.arc(fx, fz, 4, 0, Math.PI*2); ctx.fill();

    // Position actuelle
    if (document.getElementById('show-cur').checked) {
      const lp = path[path.length-1];
      const {sx:lx, sz:lz} = w2s(lp[0], lp[1]);
      ctx.fillStyle = '#e94560';
      ctx.beginPath(); ctx.arc(lx, lz, 5, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // ── Barre d'échelle ──
  updateScaleBar();
}

function gridSpacing() {
  // Choisir l'espacement de grille adapté au zoom
  const blocs_per_px = 1 / _scale;
  const target_px = 80;
  const raw = blocs_per_px * target_px;
  const exp = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / exp;
  const nice = norm < 1.5 ? 1 : norm < 3.5 ? 2 : norm < 7.5 ? 5 : 10;
  return nice * exp;
}

function updateScaleBar() {
  const blocs = Math.round(200 / _scale);
  let label;
  if (blocs >= 1000) label = (blocs/1000).toFixed(1) + ' km';
  else               label = blocs.toLocaleString() + ' bl';
  document.getElementById('scale-bar').textContent = '← ' + label + ' →';
}

// ── TP ───────────────────────────────────────────────────────────
function teleport() {
  const x = parseFloat(document.getElementById('tp-x').value);
  const z = parseFloat(document.getElementById('tp-z').value);
  if (isNaN(x) && isNaN(z)) return;

  const c  = document.getElementById('map-container');
  const cx = isNaN(x) ? s2w(c.clientWidth/2, 0).x : x;
  const cz = isNaN(z) ? s2w(0, c.clientHeight/2).z : z;

  _ox = c.clientWidth/2  - cx * _scale;
  _oz = c.clientHeight/2 - cz * _scale;
  redraw();
}

// ── Helpers ─────────────────────────────────────────────────────
function ticksToHMS(ticks) {
  const s = Math.floor(ticks / 20);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

// Index spatial : tableau de {x, idx} trié par x pour recherche binaire
let _pathIndex = null;
function buildPathIndex() {
  if (!_data || !_data.path) return;
  _pathIndex = _data.path.map((p, i) => ({x: p[0], i}))
    .sort((a, b) => a.x - b.x);
}

function nearestPathPoint(mx, mz) {
  if (!_data || !_data.path || !_pathIndex) return null;
  const THRESHOLD_PX = 14;

  // Convertir la position souris en coordonnées monde
  const {x: wx, z: wz} = s2w(mx, mz);

  // Chercher dans une fenêtre de ±THRESHOLD blocs autour de wx
  const blocsThresh = THRESHOLD_PX / _scale;

  // Recherche binaire pour trouver la zone dans l'index trié par x
  let lo = 0, hi = _pathIndex.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (_pathIndex[mid].x < wx - blocsThresh) lo = mid + 1;
    else hi = mid;
  }

  let best = null, bestD = Infinity;
  for (let k = lo; k < _pathIndex.length; k++) {
    const entry = _pathIndex[k];
    if (entry.x > wx + blocsThresh) break;
    const p = _data.path[entry.i];
    const dz = (p[1] - wz) * _scale;
    const dx = (p[0] - wx) * _scale;
    const d  = Math.hypot(dx, dz);
    if (d < bestD) { bestD = d; best = entry.i; }
  }
  return bestD < THRESHOLD_PX ? best : null;
}

// ── Events ───────────────────────────────────────────────────────
const container = document.getElementById('map-container');

container.addEventListener('wheel', e => {
  e.preventDefault();
  const rect  = container.getBoundingClientRect();
  const mx = e.clientX - rect.left, mz = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.2 : 1/1.2;
  const wx = (mx-_ox)/_scale, wz = (mz-_oz)/_scale;
  const cv_ = document.getElementById("map-container");
  const ms = minScale(cv_.clientWidth, cv_.clientHeight);
  _scale = Math.max(ms * 0.9, Math.min(50, _scale*factor));
  _ox = mx - wx*_scale; _oz = mz - wz*_scale;
  redraw();
}, {passive:false});

container.addEventListener('mousedown', e => {
  _drag=true; _dsx=e.clientX; _dsz=e.clientY; _dox=_ox; _doz=_oz;
  container.style.cursor='grabbing';
});
window.addEventListener('mousemove', e => {
  const rect = container.getBoundingClientRect();
  const mx = e.clientX-rect.left, mz = e.clientY-rect.top;
  const {x, z} = s2w(mx, mz);
  document.getElementById('cx').textContent = Math.round(x).toLocaleString();
  document.getElementById('cz').textContent = Math.round(z).toLocaleString();

  // % hint
  const pct = Math.abs(x) / FAR_LANDS * 100;
  document.getElementById('pct-hint').textContent = pct < 101 ? pct.toFixed(2)+'%' : '';

  // Tooltip chemin
  const tip = document.getElementById('tooltip');
  const nearest = nearestPathPoint(mx, mz);
  if (nearest !== null && _data.path[nearest]) {
    const pt = _data.path[nearest];
    const ptPct = (Math.abs(pt[0]) / FAR_LANDS * 100).toFixed(3);
    const igt   = pt[2] ? ticksToHMS(pt[2]) : '—';
    tip.style.display = 'block';
    tip.style.left = (mx + 14) + 'px';
    tip.style.top  = (mz + 14) + 'px';
    tip.innerHTML  = `X: ${Math.round(pt[0]).toLocaleString()}<br>Z: ${Math.round(pt[1]).toLocaleString()}<br>IGT: ${igt}<br>${ptPct}%`;
    container.style.cursor = 'default';
  } else {
    tip.style.display = 'none';
    if (!_drag) container.style.cursor = 'crosshair';
  }

  if (_drag) {
    _ox = _dox + (e.clientX-_dsx);
    _oz = _doz + (e.clientY-_dsz);
    redraw();
  }
});
window.addEventListener('mouseup', () => {
  _drag=false; container.style.cursor='crosshair';
});

// Touch
let _pinchDist = null;

function getTouchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dz = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dz);
}
function getTouchCenter(touches) {
  const rect = container.getBoundingClientRect();
  return {
    x: (touches[0].clientX + touches[1].clientX) / 2 - rect.left,
    z: (touches[0].clientY + touches[1].clientY) / 2 - rect.top,
  };
}

container.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    _drag=true; _dsx=e.touches[0].clientX; _dsz=e.touches[0].clientY;
    _dox=_ox; _doz=_oz;
    _pinchDist = null;
  } else if (e.touches.length === 2) {
    _drag = false;
    _pinchDist = getTouchDist(e.touches);
    const c = getTouchCenter(e.touches);
    _dsx = c.x; _dsz = c.z; _dox = _ox; _doz = _oz;
  }
},{passive:true});

container.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && _drag) {
    _ox = _dox + (e.touches[0].clientX - _dsx);
    _oz = _doz + (e.touches[0].clientY - _dsz);
    redraw();
  } else if (e.touches.length === 2) {
    const newDist = getTouchDist(e.touches);
    if (_pinchDist) {
      const factor = newDist / _pinchDist;
      const c = getTouchCenter(e.touches);
      const wx = (c.x - _ox) / _scale;
      const wz = (c.z - _oz) / _scale;
      const ms = minScale(container.clientWidth, container.clientHeight);
      _scale = Math.max(ms * 0.9, Math.min(50, _scale * factor));
      _ox = c.x - wx * _scale;
      _oz = c.z - wz * _scale;
      redraw();
    }
    _pinchDist = newDist;
  }
},{passive:true});

container.addEventListener('touchend', e => {
  if (e.touches.length === 0) { _drag = false; _pinchDist = null; }
  else if (e.touches.length === 1) {
    // Repasser en mode pan avec le doigt restant
    _drag = true;
    _dsx = e.touches[0].clientX; _dsz = e.touches[0].clientY;
    _dox = _ox; _doz = _oz;
    _pinchDist = null;
  }
});

// Double-clic reset
container.addEventListener('dblclick', () => { initView(); redraw(); });

// Entrée dans les inputs TP
document.getElementById('tp-x').addEventListener('keydown', e => { if(e.key==='Enter') teleport(); });
document.getElementById('tp-z').addEventListener('keydown', e => { if(e.key==='Enter') teleport(); });

window.addEventListener('resize', () => { resizeCanvas(); if(_data) redraw(); });

function toggleSidebar() {
  const s = document.querySelector('.sidebar');
  const t = document.getElementById('mobile-toggle');
  s.classList.toggle('open');
  t.textContent = s.classList.contains('open') ? '✕ Fermer' : '⚙ Options';
}

loadData();
</script>
