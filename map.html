<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Farlands — Carte</title>
  <link rel="icon" type="image/gif" href="kazuwalk.gif?v=2"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#1a1a2e; --panel:#16213e; --border:#2a2a4a;
      --accent1:#e94560; --accent3:#53d8fb; --accent4:#a8ff78;
      --gold:#f5c542; --text:#e0e0e0; --subtext:#8888aa; --radius:8px;
    }
    html, body { height:100%; background:var(--bg); color:var(--text);
      font-family:'Segoe UI',system-ui,sans-serif; font-size:14px; overflow:hidden; }

    nav {
      background:var(--panel); border-bottom:1px solid var(--border);
      display:flex; align-items:center; flex-wrap:wrap;
      gap:5px; padding:8px 16px; min-height:68px;
    }
    nav h1 { font-family:"Minecraft",monospace; font-size:.85rem; color:var(--accent3);
      margin-right:8px; display:flex; align-items:center; }
    .nav-btn {
      font-family:"Minecraft",monospace; font-size:.7rem; padding:7px 14px;
      background:#555; border-top:2px solid #aaa; border-left:2px solid #aaa;
      border-right:2px solid #222; border-bottom:2px solid #222;
      color:#fff; text-decoration:none; text-shadow:1px 1px 0 #1a1a1a;
      cursor:pointer; white-space:nowrap; flex-shrink:0;
    }
    .nav-btn:hover { filter:brightness(1.3); }
    .nav-btn.active { border-top-color:#222; border-left-color:#222;
      border-right-color:#aaa; border-bottom-color:#aaa; filter:brightness(0.85); }

    .map-layout { display:flex; height:calc(100vh - 68px); }

    /* ── Sidebar ── */
    .map-sidebar {
      width:220px; flex-shrink:0;
      background:var(--panel); border-right:1px solid var(--border);
      display:flex; flex-direction:column; overflow-y:auto;
    }
    .sidebar-section { padding:12px; border-bottom:1px solid var(--border); }
    .sidebar-section h3 { font-size:.7rem; text-transform:uppercase;
      letter-spacing:.07em; color:var(--subtext); margin-bottom:8px; }

    /* Style buttons */
    .style-btn {
      display:block; width:100%; padding:7px 10px; margin-bottom:5px;
      background:#333; border:1px solid var(--border); border-radius:4px;
      color:var(--subtext); font-size:.8rem; cursor:pointer; text-align:left;
      transition:all .15s;
    }
    .style-btn:hover { border-color:var(--accent3); color:var(--text); }
    .style-btn.active { background:var(--accent3); color:#000;
      border-color:var(--accent3); font-weight:600; }

    /* Legend */
    .legend-item { display:flex; align-items:center; gap:8px;
      font-size:.75rem; padding:2px 0; }
    .legend-dot { width:12px; height:12px; border-radius:2px; flex-shrink:0; }

    /* Coords display */
    .coords { font-family:monospace; font-size:.75rem; color:var(--subtext);
      padding:8px 12px; }

    /* ── Canvas ── */
    .map-container { flex:1; position:relative; overflow:hidden; cursor:grab; }
    .map-container:active { cursor:grabbing; }
    #map-canvas { position:absolute; top:0; left:0; }

    /* Tooltip */
    #map-tooltip {
      position:absolute; background:rgba(22,33,62,.95);
      border:1px solid var(--border); border-radius:6px;
      padding:6px 10px; font-size:.75rem; pointer-events:none;
      display:none; z-index:10; max-width:180px;
    }

    /* Loading */
    #map-loading {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      text-align:center; color:var(--subtext);
    }
    .spinner { width:32px; height:32px; border:3px solid var(--border);
      border-top-color:var(--accent3); border-radius:50%;
      animation:spin .8s linear infinite; margin:0 auto 12px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    @media (max-width:640px) {
      .map-sidebar { width:160px; }
      .style-btn { font-size:.7rem; }
    }
  </style>
</head>
<body>

<nav>
  <h1><img src="kazuwalk.gif?v=2" style="height:52px;vertical-align:middle;image-rendering:pixelated;margin-right:8px;">Farlands Tracker</h1>
  <a href="index.html" class="nav-btn">Dashboard</a>
  <a href="graph.html" class="nav-btn">Graphs</a>
  <a href="pace.html" class="nav-btn">Pace</a>
  <a href="faq.html" class="nav-btn">FAQ</a>
  <a href="map.html" class="nav-btn active">Carte</a>
</nav>

<div class="map-layout">

  <!-- Sidebar -->
  <div class="map-sidebar">
    <div class="sidebar-section">
      <h3>Style</h3>
      <button class="style-btn active" onclick="setStyle('realistic')" id="btn-realistic">🌿 Réaliste</button>
      <button class="style-btn" onclick="setStyle('topo')" id="btn-topo">🗺 Topographique</button>
      <button class="style-btn" onclick="setStyle('minecraft')" id="btn-minecraft">⛏ Minecraft</button>
    </div>

    <div class="sidebar-section">
      <h3>Afficher</h3>
      <label style="display:flex;align-items:center;gap:6px;font-size:.8rem;cursor:pointer;margin-bottom:5px;">
        <input type="checkbox" id="show-path" checked onchange="redraw()"> Chemin
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:.8rem;cursor:pointer;margin-bottom:5px;">
        <input type="checkbox" id="show-deaths" checked onchange="redraw()"> Morts
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:.8rem;cursor:pointer;">
        <input type="checkbox" id="show-grid" onchange="redraw()"> Grille chunks
      </label>
    </div>

    <div class="sidebar-section" id="legend-section">
      <h3>Légende</h3>
      <div id="legend"></div>
    </div>

    <div class="coords" id="coords">X: — | Z: —</div>
  </div>

  <!-- Map -->
  <div class="map-container" id="map-container">
    <div id="map-loading">
      <div class="spinner"></div>
      Chargement de la carte…
    </div>
    <canvas id="map-canvas"></canvas>
    <div id="map-tooltip"></div>
  </div>
</div>

<script>
// ── Data ────────────────────────────────────────────────────────
let _data = null;
let _style = 'realistic';

// ── View state ──────────────────────────────────────────────────
let _offsetX = 0, _offsetZ = 0;
let _scale   = 1;       // pixels par bloc
let _dragging = false, _dragStartX = 0, _dragStartZ = 0, _dragOffX = 0, _dragOffZ = 0;

// ── Styles ──────────────────────────────────────────────────────
const STYLES = {
  realistic: {
    name: "Réaliste",
    biomes: {
      0:  "#8DB360",  // Rain Forest
      1:  "#B1DC76",  // Swampland
      2:  "#96C054",  // Seasonal Forest
      3:  "#507832",  // Forest
      4:  "#B4C864",  // Savanna
      5:  "#649632",  // Shrubland
      6:  "#FFFFFF",  // Tundra
      7:  "#DCEEDC",  // Seasonal Forest Snow
      8:  "#C8E4FF",  // Taiga
      9:  "#FAF5D2",  // Desert
      10: "#B4C87A",  // Plains
      11: "#91AF64",  // Ice Desert
      12: "#64A0C8",  // Ocean
      13: "#78B4FF",  // River
      14: "#64AFAF",  // Mushroom
      "-1":"#3C6478",  // Unknown
    },
    bg:      "#1a2a3a",
    path:    "#ff4444",
    pathW:   2,
    death:   "#ff0000",
    grid:    "rgba(255,255,255,0.1)",
    text:    "#ffffff",
  },
  topo: {
    name: "Topographique",
    biomes: {
      0:  "#9aad7e", 1:  "#b5c99a", 2:  "#a8be8c", 3:  "#7a9a64",
      4:  "#c8c88c", 5:  "#aab882", 6:  "#e8e8e8", 7:  "#d2d8d2",
      8:  "#c8d8e0", 9:  "#e0d8b8", 10: "#b8cc8a", 11: "#a8b878",
      12: "#8aaabf", 13: "#9cb8d0", 14: "#94b4b4", "-1":"#607888",
    },
    bg:      "#2a2a22",
    path:    "#e05020",
    pathW:   2,
    death:   "#c00000",
    grid:    "rgba(200,200,150,0.15)",
    text:    "#eeeecc",
  },
  minecraft: {
    name: "Minecraft",
    biomes: {
      0:  "#83B346",  // Rain Forest → like jungle
      1:  "#2C4205",  // Swampland
      2:  "#507A32",  // Seasonal Forest
      3:  "#1F821F",  // Forest
      4:  "#BDB25F",  // Savanna
      5:  "#91BD59",  // Shrubland → like plains
      6:  "#FFFFFF",  // Tundra (snow)
      7:  "#80B497",  // Seasonal Forest Snow
      8:  "#3A7A6A",  // Taiga
      9:  "#DBCD8E",  // Desert
      10: "#91BD59",  // Plains
      11: "#80B497",  // Ice Desert
      12: "#3F76E4",  // Ocean
      13: "#3F76E4",  // River
      14: "#CC8899",  // Mushroom
      "-1":"#3F76E4", // Unknown → ocean
    },
    bg:      "#000000",
    path:    "#FF5555",
    pathW:   3,
    death:   "#FF0000",
    grid:    "rgba(0,0,0,0.3)",
    text:    "#FFFFFF",
  },
};

// ── Load data ────────────────────────────────────────────────────
async function loadMapData() {
  try {
    const isFlask = await fetch('/api/summary').then(r => r.ok).catch(() => false);
    const url = isFlask ? '/data/map_data.json' : 'data/map_data.json?_=' + Date.now();
    const r = await fetch(url);
    if (!r.ok) throw new Error('map_data.json introuvable');
    _data = await r.json();
    document.getElementById('map-loading').style.display = 'none';
    initView();
    buildLegend();
    redraw();
  } catch(e) {
    document.getElementById('map-loading').innerHTML =
      '<div style="color:#e94560">❌ ' + e.message + '<br><small>Lance gen_map.py pour générer la carte.</small></div>';
  }
}

// ── Init view ────────────────────────────────────────────────────
function initView() {
  const b = _data.bounds;
  const container = document.getElementById('map-container');
  const W = container.clientWidth;
  const H = container.clientHeight;

  const rangeX = b.max_x - b.min_x;
  const rangeZ = b.max_z - b.min_z;

  // Scale pour que tout rentre + petite marge
  _scale = Math.min(W / rangeX, H / rangeZ) * 0.9;
  _scale = Math.max(0.5, Math.min(_scale, 4));

  // Centrer
  _offsetX = W / 2 - (b.min_x + rangeX / 2) * _scale;
  _offsetZ = H / 2 - (b.min_z + rangeZ / 2) * _scale;

  resizeCanvas();
}

function resizeCanvas() {
  const container = document.getElementById('map-container');
  const canvas = document.getElementById('map-canvas');
  canvas.width  = container.clientWidth;
  canvas.height = container.clientHeight;
}

// ── Coordinates ─────────────────────────────────────────────────
function screenToWorld(sx, sz) {
  return {
    x: (sx - _offsetX) / _scale,
    z: (sz - _offsetZ) / _scale,
  };
}
function worldToScreen(x, z) {
  return {
    sx: x * _scale + _offsetX,
    sz: z * _scale + _offsetZ,
  };
}

// ── Draw ─────────────────────────────────────────────────────────
function redraw() {
  if (!_data) return;
  const canvas = document.getElementById('map-canvas');
  const ctx    = canvas.getContext('2d');
  const style  = STYLES[_style];
  const W = canvas.width, H = canvas.height;

  ctx.fillStyle = style.bg;
  ctx.fillRect(0, 0, W, H);

  const chunkPx = 16 * _scale;

  // ── Biomes ──
  const palette = _data.palettes ? _data.palettes[_style] : null;
  for (const chunk of _data.chunks) {
    const cx = chunk[0], cz = chunk[1], biome = chunk[2];
    const {sx, sz} = worldToScreen(cx * 16, cz * 16);
    if (sx > W || sz > H || sx + chunkPx < 0 || sz + chunkPx < 0) continue;
    ctx.fillStyle = palette ? (palette[String(biome)] || '#648c96') : '#648c96';
    ctx.fillRect(Math.floor(sx), Math.floor(sz), Math.ceil(chunkPx) + 1, Math.ceil(chunkPx) + 1);
  }

  // ── Grille chunks ──
  if (document.getElementById('show-grid').checked) {
    ctx.strokeStyle = style.grid;
    ctx.lineWidth = 1;
    const b = _data.bounds;
    const cxMin = Math.floor(b.min_x / 16), cxMax = Math.ceil(b.max_x / 16);
    const czMin = Math.floor(b.min_z / 16), czMax = Math.ceil(b.max_z / 16);
    for (let cx = cxMin; cx <= cxMax; cx++) {
      const {sx} = worldToScreen(cx * 16, 0);
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
    }
    for (let cz = czMin; cz <= czMax; cz++) {
      const {sz} = worldToScreen(0, cz * 16);
      ctx.beginPath(); ctx.moveTo(0, sz); ctx.lineTo(W, sz); ctx.stroke();
    }
  }

  // ── Axe X=0 et Z=0 ──
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  const {sx: ox} = worldToScreen(0, 0);
  const {sz: oz} = worldToScreen(0, 0);
  ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, oz); ctx.lineTo(W, oz); ctx.stroke();
  ctx.setLineDash([]);

  // ── Chemin ──
  if (document.getElementById('show-path').checked && _data.path.length > 0) {
    ctx.strokeStyle = style.path;
    ctx.lineWidth   = style.pathW;
    ctx.lineJoin    = 'round';
    ctx.lineCap     = 'round';
    ctx.beginPath();
    const fp = _data.path[0];
    const {sx: fx, sz: fz} = worldToScreen(fp[0], fp[1]);
    ctx.moveTo(fx, fz);
    for (let i = 1; i < _data.path.length; i++) {
      const {sx, sz} = worldToScreen(_data.path[i][0], _data.path[i][1]);
      ctx.lineTo(sx, sz);
    }
    ctx.stroke();

    // Point de départ (vert)
    ctx.fillStyle = '#00ff88';
    ctx.beginPath();
    ctx.arc(fx, fz, 5, 0, Math.PI * 2);
    ctx.fill();

    // Point actuel (rouge clignotant)
    const lp = _data.path[_data.path.length - 1];
    const {sx: lx, sz: lz} = worldToScreen(lp[0], lp[1]);
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(lx, lz, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // ── Morts ──
  if (document.getElementById('show-deaths').checked) {
    for (const ev of _data.events) {
      if (ev.t !== 'death') continue;
      const {sx, sz} = worldToScreen(ev.x, ev.z);
      if (sx < -10 || sz < -10 || sx > W+10 || sz > H+10) continue;

      // Croix rouge
      ctx.strokeStyle = style.death;
      ctx.lineWidth   = 2.5;
      const s = 7;
      ctx.beginPath();
      ctx.moveTo(sx - s, sz - s); ctx.lineTo(sx + s, sz + s);
      ctx.moveTo(sx + s, sz - s); ctx.lineTo(sx - s, sz + s);
      ctx.stroke();
    }
  }

  // ── Origine label ──
  const {sx: lox, sz: loz} = worldToScreen(0, 0);
  if (lox > 0 && lox < W && loz > 0 && loz < H) {
    ctx.fillStyle = style.text;
    ctx.font = '11px monospace';
    ctx.fillText('0,0', lox + 4, loz - 4);
  }
}

// ── Style switch ─────────────────────────────────────────────────
function setStyle(s) {
  _style = s;
  ['realistic','topo','minecraft'].forEach(id => {
    document.getElementById('btn-' + id).classList.toggle('active', id === s);
  });
  buildLegend();
  redraw();
}

// ── Legend ───────────────────────────────────────────────────────
const BIOME_NAMES = {
  0:"Rain Forest",1:"Swampland",2:"Seasonal Forest",3:"Forest",
  4:"Savanna",5:"Shrubland",6:"Tundra",7:"Sais. Forest (Snow)",
  8:"Taiga",9:"Desert",10:"Plains",11:"Ice Desert",
  12:"Ocean",13:"River",14:"Mushroom","-1":"Inconnu",
};

function buildLegend() {
  if (!_data) return;
  const style = STYLES[_style];
  const palette = _data.palettes ? _data.palettes[_style] : null;
  const names   = _data.biome_names || {};
  const seen    = new Set(_data.chunks.map(c => String(c[2])));
  const el    = document.getElementById('legend');
  el.innerHTML = Array.from(seen).sort().map(b => {
    const color = palette ? (palette[b] || '#648c96') : '#648c96';
    const name  = names[b] || ('Biome ' + b);
    return `<div class="legend-item">
      <div class="legend-dot" style="background:${color}"></div>
      <span>${name}</span>
    </div>`;
  }).join('');
}

// ── Zoom / Pan ────────────────────────────────────────────────────
const container = document.getElementById('map-container');

container.addEventListener('wheel', e => {
  e.preventDefault();
  const rect   = container.getBoundingClientRect();
  const mx     = e.clientX - rect.left;
  const mz     = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  const wx     = (mx - _offsetX) / _scale;
  const wz     = (mz - _offsetZ) / _scale;
  _scale   = Math.max(0.1, Math.min(32, _scale * factor));
  _offsetX = mx - wx * _scale;
  _offsetZ = mz - wz * _scale;
  redraw();
}, { passive: false });

container.addEventListener('mousedown', e => {
  _dragging  = true;
  _dragStartX = e.clientX;
  _dragStartZ = e.clientY;
  _dragOffX  = _offsetX;
  _dragOffZ  = _offsetZ;
});
window.addEventListener('mousemove', e => {
  const rect = container.getBoundingClientRect();
  const mx   = e.clientX - rect.left;
  const mz   = e.clientY - rect.top;
  const w    = screenToWorld(mx, mz);
  document.getElementById('coords').textContent =
    `X: ${Math.round(w.x)} | Z: ${Math.round(w.z)}`;

  // Tooltip morts
  if (_data) {
    const tooltip = document.getElementById('map-tooltip');
    let hit = null;
    for (const ev of _data.events) {
      const {sx, sz} = worldToScreen(ev.x, ev.z);
      if (Math.abs(sx - mx) < 10 && Math.abs(sz - mz) < 10) { hit = ev; break; }
    }
    if (hit) {
      tooltip.style.display = 'block';
      tooltip.style.left    = (mx + 12) + 'px';
      tooltip.style.top     = (mz + 12) + 'px';
      tooltip.innerHTML     = `<b>Mort #${hit.n}</b><br>X: ${Math.round(hit.x)} Z: ${Math.round(hit.z)}`;
    } else {
      tooltip.style.display = 'none';
    }
  }

  if (!_dragging) return;
  _offsetX = _dragOffX + (e.clientX - _dragStartX);
  _offsetZ = _dragOffZ + (e.clientY - _dragStartZ);
  redraw();
});
window.addEventListener('mouseup', () => { _dragging = false; });

// Touch support
container.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    _dragging = true;
    _dragStartX = e.touches[0].clientX;
    _dragStartZ = e.touches[0].clientY;
    _dragOffX = _offsetX; _dragOffZ = _offsetZ;
  }
}, { passive: true });
container.addEventListener('touchmove', e => {
  if (_dragging && e.touches.length === 1) {
    _offsetX = _dragOffX + (e.touches[0].clientX - _dragStartX);
    _offsetZ = _dragOffZ + (e.touches[0].clientY - _dragStartZ);
    redraw();
  }
}, { passive: true });
container.addEventListener('touchend', () => { _dragging = false; });

// Resize
window.addEventListener('resize', () => { resizeCanvas(); redraw(); });

// ── Start ─────────────────────────────────────────────────────────
loadMapData();
</script>
</body>
</html>
