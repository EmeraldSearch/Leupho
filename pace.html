<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/gif" href="kazuwalk.gif?v=2"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Farlands — Pace</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#1a1a2e; --panel:#16213e; --border:#2a2a4a;
      --accent1:#e94560; --accent3:#53d8fb; --accent4:#a8ff78;
      --gold:#f5c542; --text:#e0e0e0; --subtext:#8888aa; --radius:8px;
    }
    html,body { background:var(--bg); color:var(--text);
      font-family:'Segoe UI',system-ui,sans-serif; font-size:14px; }

    .container { padding:20px; display:flex; flex-direction:column; gap:16px; }
    .card { background:var(--panel); border:1px solid var(--border);
      border-radius:var(--radius); padding:16px; }
    .card h2 { font-size:.85rem; text-transform:uppercase; letter-spacing:.07em;
      color:var(--subtext); margin-bottom:12px; }
    .summary-row { display:flex; gap:10px; flex-wrap:wrap; }
    .sum-card { background:var(--bg); border:1px solid var(--border);
      border-radius:var(--radius); padding:10px 14px; min-width:130px; flex:1; }
    .sum-card .lbl { font-size:.68rem; color:var(--subtext); margin-bottom:4px; }
    .sum-card .val { font-size:.95rem; font-weight:700; }
    .c3  { color:var(--accent3); }
    .c4  { color:var(--accent4); }
    .c1  { color:var(--accent1); }
    .cg  { color:var(--gold); }
    .progress-wrap { background:var(--bg); border-radius:4px;
      overflow:hidden; height:12px; margin-bottom:12px; }
    .progress-fill { height:100%;
      background:linear-gradient(90deg, var(--accent3), var(--accent4));
      transition:width .5s; }
    .table-wrap { overflow-x:auto; max-height:520px; overflow-y:auto; }
    table { width:100%; border-collapse:collapse; font-size:.78rem; }
    thead th { text-align:left; padding:6px 8px; color:var(--subtext);
      border-bottom:2px solid var(--border); white-space:nowrap;
      position:sticky; top:0; background:var(--panel); z-index:1; }
    tbody tr { border-bottom:1px solid var(--border); }
    tbody tr:hover { background:rgba(255,255,255,.04); }
    tbody tr.cur { background:rgba(83,216,251,.09) !important; font-weight:600; }
    tbody td { padding:5px 8px; white-space:nowrap; }
    .faster { color:var(--accent4); }
    .slower { color:var(--accent1); }
    .neu    { color:var(--subtext); }
        /* ── Nav ── */
    nav {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      padding: 8px 16px;
      min-height: 68px;
    }
    nav h1 {
      font-family: "Minecraft", monospace;
      font-size: .85rem;
      color: var(--accent3);
      margin-right: 8px;
      display: flex;
      align-items: center;
    }
    .nav-btn {
      font-family: "Minecraft", monospace;
      font-size: .7rem;
      padding: 7px 14px;
      background: #555;
      border-top: 2px solid #aaa;
      border-left: 2px solid #aaa;
      border-right: 2px solid #222;
      border-bottom: 2px solid #222;
      color: #fff;
      text-decoration: none;
      text-shadow: 1px 1px 0 #1a1a1a;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-btn:hover { filter: brightness(1.3); }
    .nav-btn.active {
      border-top-color: #222;
      border-left-color: #222;
      border-right-color: #aaa;
      border-bottom-color: #aaa;
      filter: brightness(0.85);
    }
    @media (max-width: 480px) {
      nav h1 { font-size: .6rem; }
      .nav-btn { font-size: .45rem; padding: 4px 8px; }
    }

  </style>
</head>
<body>

<nav>
  <h1><img src="kazuwalk.gif?v=2" style="height:52px;vertical-align:middle;image-rendering:pixelated;margin-right:8px;">Farlands Tracker</h1>
  <a href="index.html" class="nav-btn">Dashboard</a>
  <a href="graph.html" class="nav-btn">Graphs</a>
  <a href="pace.html" class="nav-btn active">Pace</a>
  <a href="faq.html" class="nav-btn">FAQ</a>
</nav>

<div class="container">

  <div class="card">
    <h2>Progression</h2>
    <div class="progress-wrap">
      <div class="progress-fill" id="prog-bar" style="width:0%"></div>
    </div>
    <div class="summary-row">
      <div class="sum-card">
        <div class="lbl">Progression</div>
        <div class="val c3" id="s-pct">&#8212;</div>
      </div>
      <div class="sum-card">
        <div class="lbl">IGT total</div>
        <div class="val" id="s-igt">&#8212;</div>
      </div>
      <div class="sum-card">
        <div class="lbl">RTA</div>
        <div class="val" style="color:#53a8d8" id="s-rta">&#8212;</div>
      </div>
      <div class="sum-card">
        <div class="lbl">Pace overall</div>
        <div class="val cg" id="s-pace">&#8212;</div>
      </div>
      <div class="sum-card">
        <div class="lbl">Average % time</div>
        <div class="val" id="s-seg">&#8212;</div>
      </div>
      <div class="sum-card">
        <div class="lbl">ETA fin (overall)</div>
        <div class="val c1" id="s-eta">&#8212;</div>
      </div>
      <div class="sum-card">
        <div class="lbl">Delta vs run prec.</div>
        <div class="val" id="s-vs">&#8212;</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Tableau par % entier</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>%</th>
            <th>Distance</th>
            <th>IGT total</th>
            <th>Segment</th>
            <th>Pace overall</th>
            <th>ETA (ovr.)</th>
            <th>IGT prec.</th>
            <th>Delta IGT</th>
          </tr>
        </thead>
        <tbody id="pace-tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
var HIST = {
  0:0, 1:29385, 2:58206, 3:87505, 4:115440, 5:143875,
  6:172011, 7:199574, 8:228040, 9:255789, 10:283182,
  11:311122, 12:338800, 13:366413, 14:393842, 15:420519,
  16:448159, 17:475206, 18:502837, 19:529896, 20:557138,
  21:594513, 22:621325, 23:647870, 24:673329, 25:699321,
  26:726235, 27:753321, 28:779614, 29:805683, 30:831880,
  31:858754, 32:885811, 33:912456, 34:938539, 35:965711,
  36:992490, 37:1018800, 38:1045392, 39:1071756, 40:1096964,
  41:1123611, 42:1150531, 43:1176755, 44:1203371, 45:1230493,
  46:1255647, 47:1282950, 48:1308660, 49:1335642, 50:1360686,
  51:1386942, 52:1414246, 53:1440185, 54:1469823, 55:1496066,
  56:1522350, 57:1548293, 58:1574622, 59:1600658, 60:1626791,
  61:1653740, 62:1680811, 63:1708016, 64:1735325, 65:1762234,
  66:1789745, 67:1815340, 68:1842934, 69:1869232, 70:1896380,
  71:1923041, 72:1949125, 73:1975559, 74:2002569, 75:2029711,
  76:2055883, 77:2082633, 78:2109497, 79:2136138, 80:2163813,
  81:2189213, 82:2215539, 83:2241436, 84:2270696, 85:2298130,
  86:2324642, 87:2351678, 88:2376963, 89:2404813, 90:2432187,
  91:2458844, 92:2484633, 93:2511555, 94:2539299, 95:2565309,
  96:2592381, 97:2619335, 98:2646314
};

function pad(n) { return String(n).padStart(2, '0'); }

function fmtS(s) {
  if (s == null) return '--';
  var t = Math.round(Math.abs(s));
  return pad(Math.floor(t / 3600)) + ':' + pad(Math.floor((t % 3600) / 60)) + ':' + pad(t % 60);
}

function fmtDeltaIGT(diff) {
  if (diff == null) return '<span class="neu">--</span>';
  var cls  = diff >= 0 ? 'faster' : 'slower';
  var sign = diff >= 0 ? '-' : '+';
  return '<span class="' + cls + '">' + sign + fmtS(Math.abs(diff)) + '</span>';
}

var segPaceCache  = {};   // { pct_int: pace_bl_s } — segments terminés uniquement
var rowHtmlCache  = {};   // { pct_int: html_string } — lignes terminées

function renderPace(data) {
  if (!data || !data.length) return;

  var last = data[data.length - 1];

  document.getElementById('prog-bar').style.width = (last.i / 1000) + '%';
  document.getElementById('s-pct').textContent    = last.pct.toFixed(3) + '%';
  document.getElementById('s-igt').textContent    = fmtS(last.igt_total_s);
  document.getElementById('s-pace').textContent   = last.pace_overall.toFixed(4) + ' bl/s';
  document.getElementById('s-eta').textContent    = fmtS(last.eta_ovr_s);

  var pctF  = last.pct;
  var lo    = Math.floor(pctF);
  var hi    = Math.ceil(pctF);
  var hLo   = HIST[lo];
  var hHi   = HIST[hi];
  var hIGT  = (hLo != null && hHi != null && lo !== hi) ? hLo + (pctF - lo) * (hHi - hLo) : hLo;
  if (hIGT != null) {
    var diff  = last.igt_total_s - hIGT;
    var col   = diff <= 0 ? 'var(--accent4)' : 'var(--accent1)';
    var sign  = diff <= 0 ? '-' : '+';
    document.getElementById('s-vs').innerHTML =
      '<span style="color:' + col + '">' + sign + fmtS(Math.abs(diff)) + ' vs run prec.</span>';
  }

  var pctGroups = {};
  data.forEach(function(d) {
    var p = Math.ceil(d.pct);
    if (!pctGroups[p]) pctGroups[p] = [];
    pctGroups[p].push(d);
  });

  // Un % est terminé seulement si le % suivant a au moins un millième dans les données
  var completedPcts = Object.keys(pctGroups).map(Number).filter(function(p){ return p >= 1 && pctGroups[p + 1] != null; }).sort(function(a,b){ return a-b; });
  var avgSegS = null;
  if (completedPcts.length > 0) {
    var prevIgtAvg = 0;
    var totalSegS  = 0;
    completedPcts.forEach(function(p) {
      var lastM = pctGroups[p][pctGroups[p].length - 1];
      totalSegS  += lastM.igt_total_s - prevIgtAvg;
      prevIgtAvg  = lastM.igt_total_s;
    });
    avgSegS = totalSegS / completedPcts.length;
  }
  document.getElementById('s-seg').textContent = avgSegS != null ? fmtS(avgSegS) : '--';

  // Le % en cours = le plus grand % dont le suivant n'existe pas encore
  var currentPct = Math.max.apply(null, Object.keys(pctGroups).map(Number).filter(function(p){ return pctGroups[p + 1] == null; }));
  var prevIGT    = 0;
  var rows       = [];

  Object.keys(pctGroups).map(Number).sort(function(a, b) { return a - b; }).forEach(function(p) {
    if (p < 1) return;
    var grp   = pctGroups[p];
    var lastM = grp[grp.length - 1];
    var segS  = lastM.igt_total_s - prevIGT;

    if (p !== currentPct) {
      // Segment terminé : utiliser le cache HTML si disponible
      if (rowHtmlCache[p] == null) {
        var hIGTp     = HIST[p]     != null ? HIST[p]     : null;
        var hIGTpPrev = HIST[p - 1] != null ? HIST[p - 1] : null;
        var hSegS     = (hIGTp != null && hIGTpPrev != null) ? hIGTp - hIGTpPrev : null;
        var dIGT      = hIGTp != null ? hIGTp - lastM.igt_total_s : null;
        if (segPaceCache[p] == null && segS > 0) segPaceCache[p] = 125508.21 / segS;
        var paceSeg = segPaceCache[p] != null ? segPaceCache[p].toFixed(4) : '--';
        rowHtmlCache[p] =
          '<tr>' +
          '<td><b>' + p + '%</b></td>' +
          '<td>' + (p * 125508).toLocaleString() + ' bl</td>' +
          '<td>' + fmtS(lastM.igt_total_s) + '</td>' +
          '<td>' + fmtS(segS) + '</td>' +
          '<td>' + paceSeg + '</td>' +
          '<td>' + fmtS(lastM.eta_ovr_s) + '</td>' +
          '<td class="neu">' + (hSegS != null ? fmtS(hSegS) : '--') + '</td>' +
          '<td>' + fmtDeltaIGT(dIGT) + '</td>' +
          '</tr>';
      }
      rows.push(rowHtmlCache[p]);
    } else {
      // Segment en cours : toujours recalculé
      var hIGTp     = HIST[p]     != null ? HIST[p]     : null;
      var hIGTpPrev = HIST[p - 1] != null ? HIST[p - 1] : null;
      var hSegS     = (hIGTp != null && hIGTpPrev != null) ? hIGTp - hIGTpPrev : null;
      var distInSeg = last.distance - (p - 1) * 125508.21;
      var paceSeg   = (segS > 0 && distInSeg > 0) ? (distInSeg / segS).toFixed(4) : '--';
      rows.push(
        '<tr class="cur">' +
        '<td><b>' + p + '%</b></td>' +
        '<td>' + (p * 125508).toLocaleString() + ' bl</td>' +
        '<td>' + fmtS(lastM.igt_total_s) + '</td>' +
        '<td>' + fmtS(segS) + '</td>' +
        '<td>' + paceSeg + '</td>' +
        '<td>' + fmtS(lastM.eta_ovr_s) + '</td>' +
        '<td class="neu">' + (hSegS != null ? fmtS(hSegS) : '--') + '</td>' +
        '<td><span class="neu">—</span></td>' +
        '</tr>'
      );
    }
    prevIGT = lastM.igt_total_s;
  });

  document.getElementById('pace-tbody').innerHTML = rows.join('');
  var cur = document.querySelector('#pace-tbody .cur');
  if (cur) cur.scrollIntoView({block: 'center', behavior: 'smooth'});
}

// Détection Flask vs JSON statique
var _useFlask = null;
async function _detect() {
  if (_useFlask !== null) return;
  try {
    var p = await fetch('/api/summary', { method: 'HEAD' });
    _useFlask = p.ok;
  } catch(_) { _useFlask = false; }
}

async function loadPace() {
  try {
    await _detect();
    var paceUrl    = _useFlask ? '/api/pace'    : 'data/pace.json?_='    + Date.now();
    var summaryUrl = _useFlask ? '/api/summary' : 'data/summary.json?_=' + Date.now();
    var resp = await fetch(paceUrl);
    var data = await resp.json();
    if (data.length) {
      renderPace(data);
      try {
        var sum = await fetch(summaryUrl).then(function(r){ return r.json(); });
        if (sum.first_real_ts) {
          document.getElementById('s-rta').textContent = fmtS(Date.now() / 1000 - sum.first_real_ts);
        }
      } catch(_) {}
    } else {
      document.getElementById('pace-tbody').innerHTML =
        '<tr><td colspan="8" style="color:var(--subtext);padding:20px;text-align:center">' +
        'Aucun millieme de % complete pour le moment.</td></tr>';
    }
  } catch (e) {
    console.error('loadPace error:', e);
  }
}

loadPace();
setInterval(loadPace, 30000);
</script>
</body>
</html>
